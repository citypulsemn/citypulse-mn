name: Weekly Email Digest

# Sends the weekly digest every Thursday, and on-demand.
#
# TWO scheduled runs, because GitHub's schedule is best-effort and demonstrably
# unreliable: on 2026-08-06 the hosted runners never acquired this job, it hit the
# timeout with ZERO steps executed, and the whole list missed its email. Every
# other run has also started late — observed +1h02m, +1h39m, +3h48m, +3h52m
# against the 15:00 cron.
#   1. 15:00 UTC (~10am Central) — the real send.
#   2. 20:00 UTC (~3pm Central)  — safety net. Passes --skip-if-sent-today, so it
#      stands down when the primary already went out. It can only ever fill a gap,
#      never duplicate.
# Use the workflow_dispatch "dry_run" input to preview without sending.
on:
  schedule:
    - cron: "0 15 * * 4"
    - cron: "0 20 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + log, do not send)"
        type: boolean
        default: false

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # 60, and the reason has two halves.
    #
    # Not 15: the Aug 6 job was never SLOW — it was never STARTED, and the old
    # 15-minute ceiling cancelled it while it was still waiting for a runner. A
    # higher ceiling costs nothing on a healthy run and gives a queued one more
    # chance to be picked up. That slack is the whole point of this number.
    #
    # Not 30 any more: the verify step below can take up to 20 minutes
    # (lib/verify.ts RUN_BUDGET_MS), so a 30-minute ceiling would have left only
    # ~9 minutes of queue slack — re-creating the Aug 6 failure while appearing
    # to fix something else. 60 leaves ~39, more than the 29 this job had before.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # ORDERING, not an optimization. This used to be a separate workflow at
      # 16:00 — an hour AFTER the 15:00 send — so the highest-stakes surface on
      # the site went out ahead of the week's verification pass. An email cannot
      # be recalled. Swapping the two cron times would not have fixed it: this
      # repo has seen the scheduler drift +1h02m to +3h52m, so cron cannot order
      # two workflows. Same job, sequential steps, can.
      #
      # continue-on-error: a verification hiccup must never cost the list its
      # email. Unverified content is a worse-than-usual digest; no digest is a
      # missed week. The step reports its own failure in the log.
      #
      # Skipped on the safety-net run (the primary already did it, and re-running
      # would spend a full pass re-checking rows verified five hours earlier) and
      # on dry runs (a preview should not write verified_at).
      - name: Verify upcoming events before sending
        if: github.event.schedule != '0 20 * * 4' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: npm run verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Send weekly digest
        env:
          # Only the 20:00 run is the safety net. The primary run and every manual
          # dispatch behave exactly as before — no guard, no change.
          IS_SAFETY_NET: ${{ github.event.schedule == '0 20 * * 4' }}
          IS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: |
          ARGS=""
          if [ "$IS_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$IS_SAFETY_NET" = "true" ]; then ARGS="$ARGS --skip-if-sent-today"; fi
          echo "digest args:${ARGS:- (none)}"
          npm run digest -- $ARGS
