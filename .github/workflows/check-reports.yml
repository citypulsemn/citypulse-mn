name: Inbox — check submissions and reports

# FILE NAME IS DELIBERATE. This was check-reports.yml and still is: the run
# history under this path is how the GitHub cron-drop rate was measured (139
# runs in Sep 2026 against the 1,488 the cron asked for), and lib/check-dispatch.ts
# dispatches it by file name. It now runs the whole inbox — submissions too.

# Checks reader reports against the venue's own calendar and emails Taren the
# verdict with one-tap Take-it-down / Keep buttons.
#
# WHY THIS IS ITS OWN SCHEDULE and not part of the weekly ops digest: on
# 5 Sep 2026 a reader reported at 11:20 that our Damian Marley listing at The
# Fillmore was wrong. It was — the venue had Masego that night. The show was
# THAT EVENING. A weekly digest would have reached Taren four days after the
# doors opened. Reports are about things that are happening now.
#
# Twice an hour, offset from the hour. The job no-ops in ~20s when nothing is
# pending (it only spends an agent call when there is unchecked work), so the
# frequency costs essentially nothing on a quiet week.
#
# DO NOT TRUST THIS CRON TO BE PROMPT. It was "17 */2" until 10 Sep 2026, when it
# was tightened to :07/:37 on the theory that GitHub drops scheduled runs at some
# rate, so asking more often would land the survivors closer together. Measured
# over the 33 days since, that theory is WRONG:
#
#   cron asked 12/day  →  delivered ~5.0/day   (Sep 6-10, before)
#   cron asked 48/day  →  delivered  5.3/day   (Sep 11 - Oct 13, after)
#
# Quadrupling the request bought 0.3 runs a day. GitHub appears to cap this
# repository's scheduled delivery near five a day whatever the cron says, and the
# surviving runs do not land near :07/:37 at all — they scatter. Median gap
# between runs: 4.5 hours. Worst observed: 10h05m on 12 Oct 2026, which is WORSE
# than the 7h51m that prompted the change.
#
# So this schedule is a ~5x/day backstop with a half-day tail, not a 30-minute
# one. What actually makes reports prompt is lib/check-dispatch.ts, which fires
# this workflow on submission — report to verdict email in 54 seconds, measured.
# If GH_DISPATCH_TOKEN ever expires, prompt checking is GONE, not degraded: the
# fallback is multi-hour. Treat a dispatch failure as urgent, not cosmetic.
#
# The cron is left dense because it is marginally better and costs nothing — an
# undelivered run is not billed. Do not tighten it further expecting a result.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check + print, write nothing, send nothing)"
        type: boolean
        default: false

concurrency:
  group: check-reports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check the inbox (submissions + reports)
        run: npm run inbox ${{ github.event.inputs.dry_run == 'true' && '-- --dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          OPS_DIGEST_TO: ${{ secrets.OPS_DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Signs the one-tap decision links. Falls back to UNSUBSCRIBE_SECRET
          # when unset, so the buttons work from day one (see lib/report-token.ts).
          REPORT_ACTION_SECRET: ${{ secrets.REPORT_ACTION_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
