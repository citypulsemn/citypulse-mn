name: Weekly Event Research

# Runs the research pipeline every Monday at 06:00 UTC, and on-demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Never run two pipelines at once (a manual dispatch overlapping the cron would
# double-spend Actions minutes and race the same DB writes).
concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --prefer-offline uses the restored npm cache; --no-audit/--no-fund skip
      # network + noise steps we don't need in CI (small per-run minute saving).
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run weekly research pipeline
        run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_GEOCODING_TOKEN: ${{ secrets.MAPBOX_GEOCODING_TOKEN }}
