name: Weekly Event Research

# Runs the research pipeline every Monday at 06:00 UTC, and on-demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Never run two pipelines at once (a manual dispatch overlapping the cron would
# double-spend Actions minutes and race the same DB writes).
concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --prefer-offline uses the restored npm cache; --no-audit/--no-fund skip
      # network + noise steps we don't need in CI (small per-run minute saving).
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run weekly research pipeline
        run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_GEOCODING_TOKEN: ${{ secrets.MAPBOX_GEOCODING_TOKEN }}

      # Runs AFTER the pipeline, deliberately: the research agents are the thing
      # being corrected. Whatever they invented about the Twins this week gets
      # measured against the league's own schedule before anybody sees it.
      #
      # No ANTHROPIC_API_KEY — this step reads public league APIs, no model in
      # the loop, which is the entire point. A feed that is down reports itself
      # unavailable and changes nothing, so this step failing the run would be
      # noise; it only exits non-zero on a real error like a missing DB URL.
      - name: Reconcile sports against official league schedules
        run: npm run import-sports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Reads First Avenue's own show calendar. Slower than the sports step
      # because it fetches a detail page per show it adds, paced at 500ms to be a
      # good guest on a venue's site — a few minutes on a week with a lot of new
      # shows, and near-instant once the season is loaded.
      - name: Reconcile music against venue calendars
        run: npm run import-music
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
