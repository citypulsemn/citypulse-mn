name: Weekly Event Research

# Runs the research pipeline every Monday at 06:00 UTC, and on-demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Never run two pipelines at once (a manual dispatch overlapping the cron would
# double-spend Actions minutes and race the same DB writes).
concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --prefer-offline uses the restored npm cache; --no-audit/--no-fund skip
      # network + noise steps we don't need in CI (small per-run minute saving).
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run weekly research pipeline
        run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_GEOCODING_TOKEN: ${{ secrets.MAPBOX_GEOCODING_TOKEN }}

      # Runs AFTER the pipeline, deliberately: the research agents are the thing
      # being corrected. Whatever they invented about the Twins this week gets
      # measured against the league's own schedule before anybody sees it.
      #
      # No ANTHROPIC_API_KEY — this step reads public league APIs, no model in
      # the loop, which is the entire point. A feed that is down reports itself
      # unavailable and changes nothing, so this step failing the run would be
      # noise; it only exits non-zero on a real error like a missing DB URL.
      - name: Reconcile sports against official league schedules
        run: npm run import-sports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      # Reads First Avenue's own show calendar. Slower than the sports step
      # because it fetches a detail page per show it adds, paced at 500ms to be a
      # good guest on a venue's site — a few minutes on a week with a lot of new
      # shows, and near-instant once the season is loaded.
      - name: Reconcile listings against venue calendars
        run: npm run import-venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      # LAST, because it judges everything the steps above produced: does each
      # live listing actually appear on the page it cites? One fetch per distinct
      # source URL — 1,031 listings collapse to ~677 pages — and no model in the
      # loop, same as the two steps above.
      #
      # It runs here rather than in its own workflow so its flags are in the
      # database BEFORE the ops digest fires. That digest triggers on
      # `workflow_run: completed` for this workflow and reads the flag queue; a
      # sweep running after it would report a week late.
      #
      # `--apply` flags and un-verifies; it never archives and never edits (see
      # docs/SOURCE-CHECK.md). Transient socket failures are swallowed and
      # counted, so this only exits non-zero on a real fault — and when it does,
      # the GitHub Actions tile on /admin/ops goes red, which is the point of
      # not wrapping it in continue-on-error.
      - name: Check every listing against the page it cites
        run: npm run check-sources -- --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
