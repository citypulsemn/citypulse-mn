name: Ops Digest

# The cockpit email (roadmap 2.1): runs after the weekly pipeline completes
# (success OR failure — the cockpit reports especially when the news is bad),
# and on demand with an optional dry run.
on:
  workflow_run:
    workflows: ["Weekly Event Research"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose + log, do not send)"
        type: boolean
        default: false

concurrency:
  group: ops-digest
  cancel-in-progress: false

jobs:
  ops-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Send ops digest
        run: npm run ops-digest ${{ github.event.inputs.dry_run == 'true' && '-- --dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          OPS_DIGEST_TO: ${{ secrets.OPS_DIGEST_TO }}
          # Without this the Index-surface section can never fetch the sitemap
          # in CI — it silently rendered "sitemap not fetched" on every send.
          SITE_URL: https://www.citypulsemn.com
          # F2.4 — GSC impressions. Empty until the secret is added (Actions
          # resolves a missing secret to ""), and getSearchImpressions treats an
          # empty key as "not wired" → the digest's manual GSC line. Adding the
          # secret in GitHub is the ONLY step to go live. GSC_PROPERTY defaults
          # to sc-domain:citypulsemn.com; set it only to override.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
