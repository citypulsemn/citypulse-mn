name: Verify Upcoming Events

# Re-checks the next 7 days of events against their sources (roadmap 4.5), so a
# show cancelled mid-week doesn't sit on the calendar until Monday's research
# run.
#
# TWICE WEEKLY, because the cap was never the binding constraint — the cadence
# was. The pass looks 7 days ahead but only ran every 7 days, so a single miss
# meant an event expired unchecked. Two runs ~3.5 days apart means every event
# falls inside a run's reach at least once, and most twice.
#
#   1. Monday 20:00 UTC (2pm Central in winter, 3pm in summer) — HERE. After the
#      research pipeline and the importers have landed the week's new listings.
#      This is the one that matters most: the research agents are what invent
#      things, and this is the first look at what they just wrote.
#   2. Thursday, before the subscriber email — NOT HERE. It is a step inside
#      weekly-digest.yml, because ordering against the send is the point and
#      cron cannot guarantee it when the scheduler drifts by hours. It used to
#      be a 16:00 cron in this file, one hour AFTER the 15:00 send.
#
# So this file has one schedule and the cadence is still two. If you are adding
# a Thursday cron back here, check weekly-digest.yml first — you would be
# paying for a second full pass an hour after one already ran.
#
# Why 20:00: this run is now the FALLBACK for the supervised pass a scheduled
# task does on Taren's PC at 11am Central on Mondays (docs/MANUAL-VERIFY.md). At
# its old 12:00 slot it could fire on time at 6am, hours before that pass, and pay
# for a run the pass was about to make unnecessary. It must not move earlier than
# the local pass can finish. Research starts at 06:00 UTC and this repo's scheduler
# has fired 6-9.5h late on Mondays (Oct-Nov 2026), so research has always landed by
# then too. If this does overlap anything it is harmless: markVerified only touches
# rows still 'published', so a row just archived cannot be stamped by a race.
#
# timeout-minutes must stay ABOVE lib/verify.ts RUN_BUDGET_MS (20m) plus setup.
# The script stops itself at the budget; this is the backstop, not the schedule.
# If it ever fires, the per-batch flush means the finished batches are saved.
#
# ── STANDS DOWN IF A SUPERVISED PASS ALREADY RAN (Oct 2026) ─────────────────
# This pass measured $8.55 a run, the biggest single API line in the project.
# The research half can be done in a supervised session instead (see
# docs/MANUAL-VERIFY.md), so the SCHEDULED run now passes
# --skip-if-verified-recently=72 and exits without spending if a pass that
# decided at least STAND_DOWN_MIN_DECIDED events (lib/verify.ts) completed inside
# that window. A smaller pass is reported and ignored: on 2 Nov 2026 a one-event
# file stood down this whole job.
#
# WHY 72 AND NOT 7 DAYS. The Thursday pre-send pass lands 101h before this one
# (Thu 15:00 UTC → Mon 20:00 UTC). A window any wider than that would let
# Thursday's run suppress Monday's, collapsing the cadence back to one pass a
# week — the exact failure the twice-weekly schedule above was built to fix.
# Thursday's job has itself fired up to 6.4h late, and 72h still clears that.
#
# The gate is on `schedule` ONLY. A manual dispatch means someone wants this to
# run now, and the Thursday pass in weekly-digest.yml carries no gate at all —
# an email cannot be recalled.
#
# It fails OPEN: an unreachable database or a missing DATABASE_URL runs the
# pass rather than skipping it (lib/upsert.ts recentVerifyPasses). A lost secret
# must not quietly switch verification off while every run still shows green.
on:
  schedule:
    - cron: "0 20 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check + report, change nothing)"
        type: boolean
        default: false

concurrency:
  group: verify-events
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify upcoming events
        run: npm run verify -- ${{ github.event_name == 'schedule' && '--skip-if-verified-recently=72' || '' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
